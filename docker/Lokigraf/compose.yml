networks:
  api_net:
    external: true
  loki_net:
    external: true
  mqtt_net:
    external: true
services:
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - loki_net
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3100/ready"] # Tjekker om der er forbindelse til port 3100
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 15s
      
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail-config/config.yml:/etc/promtail/config.yml
      - ../dockMQTT/mosquitto/log:/mosquitto/log
      - ../QuestDB/app/logs:/app/logs
      - ../QuestDB/questdb-data:/var/lib/questdb/db/log
    command: -config.file=/etc/promtail/config.yml
    networks:
      - loki_net
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:9080/ready"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 10s


  grafana-alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy-config:/etc/alloy
      - ./alloy-data:/var/lib/alloy/data
    command: >
      run /etc/alloy/config.alloy
      --server.http.listen-addr=0.0.0.0:12345
      --storage.path=/var/lib/alloy/data
    networks:
      - loki_net
    healthcheck:
      test: ["CMD-SHELL", "echo", "</dev/tcp/localhost/12345"] # Tjekker om der er forbindelse til port 12345
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s


  grafana:
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
      - GF_INSTALL_PLUGINS=questdb-questdb-datasource,marcusolsson-json-datasource
    volumes:
      - ./grafana-storage:/var/lib/grafana
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy 
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - loki_net
      - api_net
    depends_on:
      grafana-alloy:
        condition: service_healthy
#      loki:
#        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "echo", "</dev/tcp/localhost/3000"] # Tjekker om der er forbindelse til port 3000
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s


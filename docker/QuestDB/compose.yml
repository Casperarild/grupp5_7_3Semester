version: "3.8"

networks:
  api_net:
    external: true
  loki_net:
    external: true
  mqtt_net:
    external: true

volumes:
  questdb-data:

services:

  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"
      - "9003:9003"
    volumes:
      - questdb-data:/var/lib/questdb
    environment:
      QDB_PG_USER: admin
      QDB_PG_PASSWORD: quest
      QDB_HTTP_AUTHENTICATION: "true"
      QDB_LOG_CONF: /conf/log.conf
    networks:
      - mqtt_net
      - api_net
      - loki_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  fastapi:
    build:
      context: ./app
    container_name: fastapi
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./app:/app
    environment:
      QDB_HOST: questdb
      QDB_PORT: "8812"
      QDB_USER: admin
      QDB_PASSWORD: quest
      QDB_DB: qdb
    depends_on:
      questdb:
        condition: service_healthy
    networks:
      - api_net
      - mqtt_net
      - loki_net
    healthcheck:
      test: ["CMD-SHELL", "echo </dev/tcp/localhost/80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s
